; Satlink 2026 - flight computer on LilyGO T-Beam Supreme v3.0 (ESP32-S3 + SX1262)
; The custom board file in boards/ is the official one from LilyGO's repository.

[env:tbeam_supreme]
platform = espressif32@6.13.0
board = t-beams3-supreme
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, time

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    jgromes/RadioLib@7.8.1
    lewisxhe/XPowersLib@^0.2.6
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    olikraus/U8g2@^2.34.17
